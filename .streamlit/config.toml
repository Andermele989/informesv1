[theme]
base = "dark"
primaryColor = "#ff9500"
backgroundColor = "#090a0f"
secondaryBackgroundColor = "#12141c"
textColor = "#f8fafc"
font = "sans serif"

[client]
# "minimal" oculta el botón Deploy y los menús de desarrollo.
toolbarMode = "minimal"
# No mostrar trazas de error (rutas internas, consultas) a los usuarios.
showErrorDetails = "none"

[server]
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
